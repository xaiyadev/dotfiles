# run through nix checks
when:
  - event: ["push", "manual"]
    branch: ["v5", "refactor/full"]
  - event: ["pull_request"]
    branch: ["v5", "refactor/full"]

engine: "nixery"

steps:
  - name: "Enter development environment"
    command: "nix develop ."
  - name: "run through nix checks"
    command: "nix flake check"
