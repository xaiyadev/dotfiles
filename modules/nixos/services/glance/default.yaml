pages:
  - name: Overview
    head-widgets:
      - type: search
        autofocus: true

    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: calendar

          - type: weather
            location: Berlin, Germany
            hour-format: 24h

      - size: full
        widgets:
          - type: group
            widgets:
              - type: monitor
                cache: 30s
                title: Services
                sites:
                  - title: Vaultwarden
                    url: https://vault.xaiya.dev/
                  - title: GitLab
                    url: https://git.xaiya.dev/
                  - title: Firefly
                    url: https://cach.xaiya.dev/
              - type: custom-api
                title: Minecraft Servers
                url: https://api.mcsrvstat.us/3/xaiya.dev
                cache: 30s
                template: |
                  <div style="display:flex; align-items:center; gap:12px;">
                    <div style="width:40px; height:40px; flex-shrink:0;  border-radius:4px; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" style="width:32px; height:32px; opacity:0.5;">
                        <path fill-rule="evenodd" d="M1 5.25A2.25 2.25 0 0 1 3.25 3h13.5A2.25 2.25 0 0 1 19 5.25v9.5A2.25 2.25 0 0 1 16.75 17H3.25A2.25 2.25 0 0 1 1 14.75v-9.5Zm1.5 5.81v3.69c0 .414.336.75.75.75h13.5a.75.75 0 0 0 .75-.75v-2.69l-2.22-2.219a.75.75 0 0 0-1.06 0l-1.91 1.909.47.47a.75.75 0 1 1-1.06 1.06L6.53 8.091a.75.75 0 0 0-1.06 0l-2.97 2.97ZM12 7a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z" clip-rule="evenodd" />
                      </svg>
                    </div>

                    <div style="flex-grow:1; min-width:0;">
                      <a class="size-h4 block text-truncate color-highlight">
                        {{ .JSON.String "motd.raw.0" }}
                          {{ if .JSON.Bool "online" }}
                            <span
                              style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-positive); display: inline-block; vertical-align: middle;"
                              data-popover-type="text"
                              data-popover-text="Online"
                            ></span>
                          {{ else }}
                            <span
                              style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-negative); display: inline-block; vertical-align: middle;"
                              data-popover-type="text"
                              data-popover-text="Offline"
                            ></span>
                          {{ end }}
                      </a>

                      <ul class="list-horizontal-text">
                        <li>
                          {{ if .JSON.Bool "online" }}
                            <span>{{ .JSON.String "version" }}</span>
                          {{ else }}
                            <span>Offline</span>
                          {{ end }}
                        </li>
                        {{ if .JSON.Bool "online" }}
                          <li data-popover-type="html">
                            <div data-popover-html>
                              {{ range .JSON.Array "players.list" }}<br>{{ end }}
                          </div>
                            <p style="display:inline-flex;align-items:center;">
                              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6" style="height:1em;vertical-align:middle;margin-right:0.5em;">
                                <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                              </svg>
                              {{ .JSON.Int "players.online" | formatNumber }}/{{ .JSON.Int "players.max" | formatNumber }} players
                            </p>
                          </li>
                          {{ else }}
                            <li>
                              <p style="display:inline-flex;align-items:center;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6" style="height:1em;vertical-align:middle;margin-right:0.5em;opacity:0.5;">
                                  <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                                </svg>
                                0 players
                              </p>
                            </li>
                          {{ end }}
                          </ul>
                        </div>
                      </div>

              - type: custom-api
                title: Trending Repositories
                cache: 24h
                url: https://api.ossinsight.io/v1/trends/repos/?period=past_24_hours&language=All
                template: |
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="2">
                    {{ range .JSON.Array "data.rows"}}
                    <li>
                      <a class="color-primary-if-not-visited" href="https://github.com/{{ .String "repo_name" }}">{{ .String "repo_name" }}</a>
                      <ul class="list-horizontal-text">
                        <li class="color-highlight"> {{.String "primary_language"}} </li>
                        <li style="display: flex; align-items: center;gap: 4px;">
                          {{ .Int "stars" }}
                            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                              <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
                          </svg>
                        </li>
                        <li style="display: flex; align-items: center;gap: 4px;">
                          {{ .Int "forks" }}
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                              <circle cx="12" cy="18" r="2" />
                              <circle cx="7" cy="6" r="2" />
                              <circle cx="17" cy="6" r="2" />
                              <path d="M7 8v2a2 2 0 0 0 2 2h6a2 2 0 0 0 2 -2v-2" />
                              <path d="M12 12l0 4" />
                            </svg>
                        </li>

                        <li style="display: flex; align-items: center;gap: 4px;">
                          {{ .Int "pull_requests" }}
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                              <circle cx="6" cy="6" r="3"></circle>
                              <circle cx="18" cy="18" r="3"></circle>
                              <path d="M13 6h3a2 2 0 0 1 2 2v7"></path>
                              <line x1="6" y1="9" x2="6" y2="21"></line>
                            </svg>
                        </li>

                      </ul>
                      
                      <ul class="list collapsible-container">
                        <li style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" class="color-subdue">
                          Contributors: {{ .String "contributor_logins"}}
                        </li>
                        <li>
                          {{ .String "description" }}
                        </li>
                      </ul>
                    </li>
                    {{ end }}
                  </ul>

      - type: small
        widgets:
          - type: custom-api
            title: Recent listens
            cache: 60s
            url: http://ws.audioscrobbler.com/2.0/
            parameters:
              method: user.getRecentTracks
              user: xaiyadev
              api_key: ${LASTFM_APIKEY}
              format: json
              limit: 5
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="1">
              {{ range .JSON.Array "recenttracks.track" }}
                <li class="flex items-center gap-10">
                  <img src={{ .String "image.2.#text" }} style="border-radius: 5px; min-width: 5rem; max-width: 5rem;" class="card">
                  <div class="flex-1">
                    <p class="color-positive size-h5">{{ .String "artist.#text" }}</p>
                    <p class="size-h5">{{ .String "name" }}</p>
                    <p class="size-h6">
                      {{ if .String "@attr.nowplaying" }}
                        <span class="color-positive">Now playing</span>
                      {{ else }}
                        <span class="color-subdue" {{ .String "date.#text" | parseRelativeTime "02 Jan 2006, 15:04" }}></span>
                      {{ end }}
                    </p>
                  </div>
                </li>
              {{ end }}
              </ul>

          - type: releases
            show-source-icon: true
            repositories:
              - WillPower3309/swayfx
              - Inrixia/TidaLuna

          - type: server-stats
            servers:
              - type: local
                name: Apricot
                mountpoints:
                  /mnt/raid:
                    name: /mnt/raid

          - type: custom-api
            title: Tailscale devices
            title-url: https://login.tailscale.com/admin/machines
            url: https://api.tailscale.com/api/v2/tailnet/-/devices
            headers:
              Authorization: Bearer ${TAILSCALE_API}
            cache: 10m
            template: |
              {{/* User Variables */}}
              {{/* Set to true if you'd like an indicator for online devices */}}
              {{ $enableOnlineIndicator := true }}
              
              <style>
              .device-info-container {
              position: relative;
              overflow: hidden;
              height: 1.5em;
              }
              
              .device-info {
              display: flex;
              transition: transform 0.2s ease, opacity 0.2s ease;
              }
              
              .device-ip {
              position: absolute;
              top: 0;
              left: 0;
              transform: translateY(-100%);
              opacity: 0;
              transition: transform 0.2s ease, opacity 0.2s ease;
              }
              
              .device-info-container:hover .device-info {
              transform: translateY(100%);
              opacity: 0;
              }
              
              .device-info-container:hover .device-ip {
              transform: translateY(0);
              opacity: 1;
              }
              
              .update-indicator {
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background-color: var(--color-primary);
              display: inline-block;
              margin-left: 4px;
              vertical-align: middle;
              }
              
              .offline-indicator {
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background-color: var(--color-negative);
              display: inline-block;
              margin-left: 4px;
              vertical-align: middle;
              }
              
              .online-indicator {
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background-color: var(--color-positive);
              display: inline-block;
              margin-left: 4px;
              vertical-align: middle;
              }
              
              .device-name-container {
              display: flex;
              align-items: center;
              gap: 8px;
              }
              
              .indicators-container {
              display: flex;
              align-items: center;
              gap: 4px;
              }
              </style>
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="4">
              {{ range .JSON.Array "devices" }}
              <li>
              <div class="flex items-center gap-10">
              <div class="device-name-container grow">
              <span class="size-h4 block text-truncate color-primary">
              {{ findMatch "^([^.]+)" (.String "name") }}
              </span>
              <div class="indicators-container">
              {{ if (.Bool "updateAvailable") }}
              <span class="update-indicator" data-popover-type="text" data-popover-text="Update Available"></span>
              {{ end }}
              
              {{ $lastSeen := .String "lastSeen" | parseTime "rfc3339" }}
              {{ if not ($lastSeen.After (offsetNow "-10s")) }}
              {{ $lastSeenTimezoned := $lastSeen.In now.Location }}
              <span class="offline-indicator" data-popover-type="text"
                data-popover-text="Offline - Last seen {{ $lastSeenTimezoned.Format " Jan 2 3:04pm" }}"></span>
              {{ else if $enableOnlineIndicator }}
                <span class="online-indicator" data-popover-type="text" data-popover-text="Online"></span>
              {{ end }}
              </div>
              </div>
              </div>
              <div class="device-info-container">
              <ul class="list-horizontal-text device-info">
              <li>{{ .String "os" }}</li>
              <li>{{ .String "user" }}</li>
              </ul>
              <div class="device-ip">
              {{ .String "addresses.0"}}
              </div>
              </div>
              </li>
              {{ end }}
              </ul>

